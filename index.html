<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Leavitt Field Hockey</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c&family=Oswald:wght@200..700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-inner">
    <p class="eyebrow">Leavitt High School</p>
    <h1>Field Hockey</h1>
    <nav>
      <a href="roster.html">Roster</a>
      <span class="divider">/</span>
      <a href="schedule.html">Schedule</a>
    </nav>
  </div>
</header>

<section class="next-game">
  <div class="next-game-content">
    <p class="eyebrow">Next match</p>
    <h2>Loading...</h2>
    <p class="game-meta"></p>
  </div>

  <div class="game-icons">
    <div class="calendar-wrap">
      <button class="icons" id="calendar-btn" type="button" aria-label="Add to calendar" title="Add to calendar"></button>
      <div class="calendar-menu" id="calendar-menu" hidden>
        <a class="calendar-menu-option" id="google-cal-link" href="#" target="_blank" rel="noopener">Google Calendar</a>
        <button class="calendar-menu-option" id="ics-cal-btn" type="button">Apple / Outlook (.ics)</button>
      </div>
    </div>
    <button class="icons bell-icon" id="remind-btn" type="button" aria-label="Save reminder" title="Save reminder"></button>
  </div>

</section>

<section class="photo-strip">
</section>

<section class="recent-results">
  <h2>Recent Results</h2>
  <div class="results-list"></div>
</section>

<script src="next-game.js"></script>
<script src="photo-strip.js"></script>
<script src="recent-results.js"></script>

<footer>
  <div class="footer-content">
    <div class="social-media" aria-label="Social media">
      <a href="https://www.instagram.com/lahs_fhock/" aria-label="Instagram">
        <img src="https://cdn-icons-png.flaticon.com/128/1051/1051364.png" alt="">
      </a>
      <a href="https://www.tiktok.com/@leavitt_fhock" aria-label="TikTok">
        <img src="https://cdn-icons-png.flaticon.com/128/3046/3046125.png" alt="">
      </a>
    </div>
    <div class="footer-tools">
      <a class="github-link" href="https://github.com/Aehast11" aria-label="GitHub">
        <img src="https://cdn-icons-png.flaticon.com/128/1051/1051377.png" alt="">
      </a>
      <details class="bug-report">
        <summary>Report a bug</summary>
        <a href="mailto:aehast11@azlus.com">aehast11@azlus.com</a>
      </details>
    </div>
  </div>
  <a class="credits" href="https://aehast11.vercel.app/">.</a>
</footer>

</body>
</html>
